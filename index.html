<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script defer src="js/src/hash/md5/min.js"></script>
    <script defer src="js/src/hash/sha1/min.js"></script>
    <script defer src="js/src/hash/sha224/min.js"></script>
    <script defer src="js/src/hash/sha256/min.js"></script>
    <script defer src="js/src/hash/sha384/min.js"></script>
    <script defer src="js/src/hash/sha512/min.js"></script>
    <script defer src="js/src/hash/sha3-224/min.js"></script>
    <script defer src="js/src/hash/sha3-256/min.js"></script>
    <script defer src="js/src/hash/sha3-384/min.js"></script>
    <script defer src="js/src/hash/sha3-512/min.js"></script>
    <script defer src="js/src/convert/base32/min.js"></script>
    <script defer src="js/main.min.js"></script>
    <title>Hash</title>
</head>

<body class="container text-center font-monospace">
    <header>
        <h1 class="mt-4 mb-3">Hash</h1>
    </header>
    <main>
        <h2 class="text-start">Text / File</h2>
        <div class="row">
            <div class="col-lg-3">
                <div class="mb-3 form-floating">
                    <select name="mode-select" id="mode-select" class="form-select"></select>
                    <label for="mode-select" class="form-label">Mode</label>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-3 form-floating">
                    <select name="hash-algorithm-select" id="hash-algorithm-select" class="form-select"></select>
                    <label for="hash-algorithm-select" class="form-label">Algorithm</label>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-3 form-floating">
                    <select name="hash-encoding-select" id="hash-encoding-select" class="form-select"></select>
                    <label for="hash-encoding-select" class="form-label">Encoding</label>
                </div>
            </div>
            <div class="col-lg-3" id="hash-rounds-div">
                <div class="mb-3 form-floating">
                    <input type="number" name="hash-rounds-input" id="hash-rounds-input" class="form-control">
                    <label for="hash-rounds-input" class="form-label">Rounds</label>
                </div>
            </div>
            <div class="col-lg-3" id="hmac-length-div">
                <div class="mb-3 form-floating">
                    <input type="number" name="hmac-length-input" id="hmac-length-input" class="form-control">
                    <label for="hmac-length-input" class="form-label">Length (bytes)</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col" id="hmac-key-div">
                <div class="mb-3 form-floating">
                    <input type="text" name="hmac-key-input" id="hmac-key-input" class="form-control">
                    <label for="hmac-key-input" class="form-label">Key</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="mb-3 form-floating">
                    <textarea name="text-textarea" id="text-textarea" class="form-control"
                        spellcheck="false"></textarea>
                    <label for="text-textarea" class="form-label">Text</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <input type="file" name="file-input" id="file-input" class="form-control">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <hr>
            </div>
        </div>
        <h2 class="text-start">Checksum</h2>
        <div class="row">
            <div class="col">
                <div class="mb-3 form-floating">
                    <input type="text" name="checksum-input" id="checksum-input" class="form-control" spellcheck="false"
                        readonly>
                    <label for="checksum-input" id="checksum-input-label" class="form-label">-</label>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
